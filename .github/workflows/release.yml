name: Release

# Cutting a release is the difference between "clone main and hope" and "pin a
# version". Anyone consuming this repo needs a fixed point they can name.
#
# Trigger: push a tag. Nothing is automatic, because a release is a claim that
# the contents are worth depending on, and that is a judgement.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v0.3.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # notes need the history

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run every gate in the repo
        run: |
          set -euo pipefail
          # A release must not be cuttable from a red tree. Every verify-*
          # script in the repo runs, and any non-zero stops the release.
          found=0
          for g in $(git ls-files | grep -E '(^|/)verify[-_].*\.(py|sh)$' || true); do
            found=$((found+1))
            echo "::group::$g"
            if [ "${g##*.}" = "py" ]; then python "$g"; else bash "$g"; fi
            echo "::endgroup::"
          done
          echo "ran $found gate(s)"
          if [ "$found" -eq 0 ]; then
            echo "::warning::no verify-* gate found in this repo"
          fi

      - name: Generate notes and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        # Notes are generated in Python, not shell. Two shell attempts died with
        # exit 141: `git tag | grep | head -1` and `git log | head -25` both take
        # SIGPIPE when head closes the pipe, and under `set -o pipefail` that
        # kills the step after it has produced the right answer. Rather than
        # patch a third pipe, this removes the class.
        run: |
          python3 - <<'PYEOF'
          import os, subprocess, pathlib

          tag  = os.environ["TAG"]
          repo = os.environ["GITHUB_REPOSITORY"]

          def git(*a):
              return subprocess.run(["git", *a], capture_output=True, text=True).stdout.splitlines()

          tags = [t for t in git("tag", "--sort=-v:refname") if t != tag]
          prev = tags[0] if tags else None

          lines = ["## What changed", ""]
          if prev:
              rng = f"{prev}..{tag}"
              log = git("log", "--no-merges", "--pretty=- %s", rng) or \
                    git("log", "--no-merges", "--pretty=- %s", f"{prev}..HEAD")
              lines += log or ["- No commits between tags."]
          else:
              lines += ["First tagged release.", ""]
              lines += git("log", "--no-merges", "--pretty=- %s")[:25]

          lines += ["", "## Consuming this", "",
                    "```bash",
                    f"git clone --branch {tag} --depth 1 https://github.com/{repo}.git",
                    "```", "",
                    "See `CONSUMING.md` for how to run the gates and what they mean."]

          pathlib.Path("/tmp/notes.md").write_text("\n".join(lines))
          print(f"notes: {len(lines)} lines, previous tag {prev or 'none'}")
          PYEOF

          gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md \
            || gh release edit "$TAG" --notes-file /tmp/notes.md
