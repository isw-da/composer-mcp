[project]
name = "composer-mcp"
version = "0.4.3"
description = "MCP server for Logi Composer. Wraps the Composer v25 REST API as MCP tools so any Claude session can drive Composer end-to-end."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0.0",
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
]

[project.scripts]
composer-mcp = "composer_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/composer_mcp"]
